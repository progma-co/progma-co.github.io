name: Atlas data check
on:
  pull_request:
    paths: ["atlas/data/**"]
  push:
    branches: [main]
    paths: ["atlas/data/**"]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python atlas/tools/validate.py
